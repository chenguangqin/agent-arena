# Command Adapter v0.2 descriptor (docs/AGENT_PROTOCOL.md).
[agent]
schema_version = "0.2"
id = "arena-lab2"
title = "Lab2 · Tools, MCP and governance (M2)"

[source]
repository = ".."
revision = "git"

[launcher]
adapter = "command"
command = ["uv", "run", "--frozen", "python", "-m", "lab2", "run"]
input = "jsonl-stdin"
result = "json-file"
result_path = "run/result.json"
startup_timeout_seconds = 60
run_timeout_seconds = 1800

[environment]
access = "mcp"
tools = ["environment_exec"]
tool_timeout_seconds = 120
max_output_chars = 16000

[state]
mode = "isolated-copy"
snapshot_paths = []
empty_paths = ["reports", "run"]

[artifacts]
paths = ["reports/**", "run/**"]

[capabilities]
structured_result = true
token_usage = "sdk"
tool_events = true
model_override = "honored"
step_budget = "honored"

[parameters.profile]
type = "enum"
values = ["baseline", "tools", "mcp_server", "governance", "governance_sdk", "full"]
default = "baseline"
delivery = "argv"
flag = "--profile"

[parameters.model_id]
type = "string"
default = "global.anthropic.claude-haiku-4-5-20251001-v1:0"
delivery = "env"
name = "MODEL_ID"

[parameters.aws_region]
type = "string"
default = "us-west-2"
delivery = "env"
name = "AWS_REGION"
