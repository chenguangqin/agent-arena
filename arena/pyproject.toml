[project]
name = "agent-arena-eval"
version = "0.1.0"
description = "Harbor agents and helpers for Agent Arena evaluations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "harbor==0.24.0",
    "strands-agents==1.60.0",
    "boto3",
    "aws-bedrock-token-generator>=1.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
