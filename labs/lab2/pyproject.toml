[project]
name = "lab2-tools-mcp"
version = "0.1.0"
description = "Lab2 · Tools 与 MCP（Strands Agents）"
requires-python = ">=3.12"
dependencies = [
    "strands-agents==1.60.0",
    "mcp>=1.23,<2",  # FastMCP (mcp.server.fastmcp) is the 1.x API
    "boto3>=1.41,<2",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "httpx>=0.27",
    "ruff>=0.15,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Raised inside Strands' MCPClient under mcp 1.30; not from lab code.
filterwarnings = ["ignore:Use `streamable_http_client` instead:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
