[project]
name = "agent-arena-labs"
version = "0.1.0"
description = "Lab agents (Strands) for the AI agent harness-engineering course."
requires-python = ">=3.12"
dependencies = [
    "strands-agents==1.60.0",
    "mcp>=2.1,<3",
    "boto3>=1.41,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "devstore", "lab1", "lab2", "lab3", "lab4", "lab5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
